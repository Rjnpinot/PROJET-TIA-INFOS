<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — TIA INFO</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../img/Logo_Tia_Infos.jpg">
</head>
<body class="bg-noir">
  <div class="auth-card">
    <img src="../img/Logo_Tia_Infos.jpg" alt="Logo TIA INFO" class="auth-logo">
    <h1>Connexion<span>Accès étudiant sécurisé</span></h1>
    <form onsubmit="handleAuth(event, 'login')" autocomplete="on" aria-label="Formulaire de connexion">
      <div class="form-group">
        <label for="login-email">Email académique</label>
        <input type="email" id="login-email" name="email" placeholder="nom@exemple.com" required autocomplete="email" aria-required="true">
      </div>
      <div class="form-group-relative">
        <label for="login-pass">Mot de passe</label>
        <input type="password" id="login-pass" name="password" placeholder="Votre mot de passe" required autocomplete="current-password" aria-required="true">
        <button type="button" id="toggle-password" aria-label="Afficher/Masquer le mot de passe" class="toggle-password-btn">👁️</button>
      </div>
      <div id="login-error" class="auth-error-msg"></div>
      <button type="submit" class="btn-gold btn-gold-full">Se connecter</button>
      <div id="verify-resend" class="verify-resend-container">
        <span class="warning-text">Votre compte n'est pas vérifié ?</span>
        <a href="#" onclick="resendVerificationEmail(event)">Renvoyer l'email de vérification</a>
      </div>
    </form>
    <div class="auth-footer">
      <p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
      <a href="../../" class="back-link">← Retour à l'accueil</a>
    </div>
  </div>
  <script>
    // Afficher/Masquer le mot de passe
    document.addEventListener('DOMContentLoaded', function() {
      const passInput = document.getElementById('login-pass');
      const toggleBtn = document.getElementById('toggle-password');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', function() {
          if (passInput.type === 'password') {
            passInput.type = 'text';
            toggleBtn.textContent = '🙈';
          } else {
            passInput.type = 'password';
            toggleBtn.textContent = '👁️';
          }
        });
      }
    });
  </script>

  <script src="../js/db.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { handleAuth } from '../js/app.js';
    window.handleAuth = handleAuth;
  </script>
  <script>
    async function resendVerificationEmail(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      if (!email) {
        alert('Veuillez saisir votre email dans le champ ci-dessus.');
        return;
      }
      try {
        const response = await fetch('http://localhost:5000/api/auth/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erreur lors de l\'envoi');
        
        alert('Email de vérification renvoyé ! Veuillez vérifier votre boîte de réception.');
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    }
    // Affichage du lien si besoin après tentative de login
    window.showResendVerification = function() {
      document.getElementById('verify-resend').style.display = 'block';
    }
  </script>
</body>
</html>
